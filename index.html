<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter For You</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="intro" id="introText">
      i don’t know where this will lead us, but i want to be honest about how i feel for you.
    </div>

    <button class="btn" onclick="showBook()">
      Open Letter
    </button>

    <!-- MUSIC -->
    <audio id="bgMusic" loop>
      <source src="music.mp3" type="audio/mpeg" />
    </audio>

    <!-- BOOK -->
    <div class="book" id="book">
      <div class="page">
        <p id="typedText"></p>
      </div>

      <!-- ENDING -->
      <div class="last-page" id="lastPage">
        <p class="ending-text">
          Here i’ve made a playlist for you kha khun suay ♡
        </p>

        <img src="ttd.jpeg" class="flower" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
